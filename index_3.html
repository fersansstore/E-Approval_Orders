<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FERSANS | Penyimpanan Data Order</title>
<style>
:root{--ink:#20242b;--muted:#68707d;--line:#e4e7ec;--bg:#f4f6f8;--gold:#b28a4a;--green:#18794e;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#17191d;color:#fff;padding:20px max(20px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:3px;font-size:22px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#c7b18d;font-weight:500}
main{max-width:1100px;margin:24px auto;padding:0 16px}
button{border:0;border-radius:8px;padding:9px 13px;font-weight:650;cursor:pointer;background:#20242b;color:#fff}
button.secondary{background:#fff;color:#303640;border:1px solid var(--line)}button.gold{background:var(--gold)}button.danger{background:#fff0ef;color:var(--red);border:1px solid #ffd2ce}
.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;box-shadow:0 2px 10px #17202a08}
h1{font-size:25px;margin:0 0 4px}.sub{color:var(--muted)}.bar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}.bar div.t{display:flex;gap:8px;flex-wrap:wrap}
input{border:1px solid var(--line);border-radius:7px;padding:9px 10px;font:inherit;width:100%}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;color:var(--muted);background:#fafbfc}td.act{white-space:nowrap}td.act button{padding:6px 10px;font-size:12px;margin-right:4px}
.hidden{display:none!important}.userchip{font-size:12px;color:#d1d5db}.userchip b{color:#fff}
.login-screen{position:fixed;inset:0;z-index:1000;background:#17191d;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.login-card{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:400px}.login-card .brand{color:#17191d;text-align:center;margin-bottom:18px}.login-card .brand small{color:var(--gold)}
.login-card label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin:0 0 5px}.login-card .f{margin-bottom:12px}.login-card button{width:100%}.login-err{color:var(--red);font-size:12px;min-height:18px;margin:0 0 10px}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen"><div class="login-card">
 <div class="brand">FERSANS<small>PENYIMPANAN DATA ORDER</small></div>
 <div class="f"><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
 <div class="f"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
 <p class="login-err" id="err" role="alert"></p><button class="gold" id="loginBtn">Masuk sebagai Admin</button>
</div></div>
<header><div class="brand">FERSANS<small>PENYIMPANAN DATA ORDER</small></div><div><span class="userchip">Masuk sebagai <b>Admin</b></span> <button class="secondary" id="logoutBtn">Keluar</button></div></header>
<main><section class="panel">
 <div class="bar"><div><h1>Data Order Pemesan</h1><div class="sub" id="count"></div></div>
 <div class="t"><input id="q" placeholder="Cari no. order / nama / instansi" style="width:260px"><button class="secondary" id="syncBtn">Muat dari Server</button></div></div>
 <div class="tablewrap"><table><thead><tr><th>No. Order</th><th>Waktu Masuk</th><th>Pemesan</th><th>Instansi</th><th>Kontak</th><th>Total</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div>
 <p class="sub hidden" id="empty">Belum ada order tersimpan di server.</p>
</section></main>
<script>
const $=id=>document.getElementById(id);
const SESS='fersans-storage-auth';
const ENDPOINT='https://script.google.com/macros/s/AKfycbzUQJ6ew9XHSRSdxAsJgcV-iBBAzEbmq4pN_9_lJBmOAkEg87sCSG3mv5ZEH-ToGLPlnA/exec'; // <- tempel URL Web App Apps Script (berakhiran /exec). Harus SAMA dengan ENDPOINT di index_2.html
let AUTH=null,orders=[],busy=false;
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupiah=n=>'Rp'+(Number(n)||0).toLocaleString('id-ID');
async function api(action,extra={}){
 if(!ENDPOINT)throw new Error('ENDPOINT belum diatur di file ini');
 const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,email:AUTH.email,key:AUTH.key,...extra})});
 const j=await r.json();if(!j.ok)throw new Error(j.error||'server');return j;
}
function blobOf(d){const b=atob(d.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:'application/pdf'})}
function setOrders(list){orders=(list||[]).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));render()}
function logout(){try{sessionStorage.removeItem(SESS)}catch{}location.reload()}
async function refresh(){
 if(busy)return;busy=true;$('syncBtn').textContent='Memuat…';
 try{setOrders((await api('list')).orders)}
 catch(e){if(e.message==='auth'){logout();return}$('count').textContent='Gagal memuat dari server ('+e.message+')'}
 finally{busy=false;$('syncBtn').textContent='Muat dari Server'}
}
function render(){
 const q=$('q').value.trim().toLowerCase(),list=orders.filter(o=>[o.orderNo,o.customerName,o.company].join(' ').toLowerCase().includes(q));
 $('count').textContent=orders.length+' order tersimpan';$('empty').classList.toggle('hidden',list.length>0);
 $('rows').innerHTML=list.map(o=>`<tr><td><b>${esc(o.orderNo)}</b></td><td>${esc(new Date(o.createdAt).toLocaleString('id-ID'))}</td><td>${esc(o.customerName)}</td><td>${esc(o.company)}</td><td>${esc(o.contact)}</td><td>${rupiah(o.total)}</td><td class="act"><button data-a="open" data-n="${esc(o.orderNo)}">Buka PDF</button><button class="secondary" data-a="dl" data-n="${esc(o.orderNo)}">Unduh</button><button class="danger" data-a="del" data-n="${esc(o.orderNo)}">Hapus</button></td></tr>`).join('');
}
$('rows').addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;const o=orders.find(x=>x.orderNo===b.dataset.n);if(!o)return;
 try{
  if(b.dataset.a==='del'){
   if(!confirm('Hapus order '+o.orderNo+' dari penyimpanan? Data di server ikut terhapus.'))return;
   await api('delete',{orderNo:o.orderNo});refresh();return;
  }
  const w=b.dataset.a==='open'?window.open('about:blank','_blank'):null;
  b.disabled=true;
  try{
   const url=URL.createObjectURL(blobOf((await api('pdf',{orderNo:o.orderNo})).pdf));
   if(b.dataset.a==='open'){if(w)w.location=url;else location.href=url}
   else{const a=document.createElement('a');a.href=url;a.download=o.orderNo+'.pdf';a.click()}
  }catch(err){if(w)w.close();throw err}finally{b.disabled=false}
 }catch(err){alert(err.message==='auth'?'Sesi berakhir, silakan login ulang.':'Gagal: '+err.message)}
});
$('q').addEventListener('input',render);
$('syncBtn').onclick=refresh;
async function login(){
 const em=$('em').value.trim().toLowerCase(),pw=$('pw').value,btn=$('loginBtn');
 $('err').textContent='';btn.disabled=true;btn.textContent='Memeriksa…';AUTH={email:em,key:pw};
 try{
  const j=await api('list');
  try{sessionStorage.setItem(SESS,JSON.stringify(AUTH))}catch{}
  $('pw').value='';$('loginScreen').classList.add('hidden');setOrders(j.orders);
 }catch(e){AUTH=null;$('err').textContent=e.message==='auth'?'Email atau password salah.':'Tidak dapat terhubung ke server: '+e.message}
 finally{btn.disabled=false;btn.textContent='Masuk sebagai Admin'}
}
$('loginBtn').onclick=login;['em','pw'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')login()}));
$('logoutBtn').onclick=logout;
// muat ulang otomatis: saat jendela aktif kembali & tiap 30 detik
window.addEventListener('focus',()=>{if(AUTH)refresh()});
setInterval(()=>{if(AUTH&&!document.hidden)refresh()},30000);
try{const s=JSON.parse(sessionStorage.getItem(SESS));if(s&&s.email){AUTH=s;$('loginScreen').classList.add('hidden');refresh()}}catch{}
</script>
</body></html>
